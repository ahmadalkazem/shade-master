name: Android build

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.8
  FLUTTER_SHA256: baf7dcc5a3dbba60fe863bf493a6cf203195621f7786eaa5a1bba02cd0d87dd2

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Flutter ${{ env.FLUTTER_VERSION }}
        run: |
          curl -fsSL -o "$RUNNER_TEMP/flutter.tar.xz" \
            "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${FLUTTER_VERSION}-stable.tar.xz"
          echo "${FLUTTER_SHA256}  $RUNNER_TEMP/flutter.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/flutter.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - run: flutter --version
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release

      - name: Show APK details
        run: |
          apk=build/app/outputs/flutter-apk/app-release.apk
          build_tools="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)"
          ls -l "$apk"
          "${build_tools}aapt2" dump badging "$apk" | grep -E "^(package|minSdkVersion|sdkVersion|targetSdkVersion|application-label:|native-code)"
          # minSdk 24 means v2+ signatures only, which keytool cannot read.
          "${build_tools}apksigner" verify --print-certs "$apk" | grep -E "certificate (DN|SHA-256)"
          unzip -v "$apk" "lib/*"

      - uses: actions/upload-artifact@v5
        with:
          name: shadesmaster-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
